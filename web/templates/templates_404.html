{% extends "templates_base.html" %}
{% block title %}404 — job-bot{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:1.25rem">
  <div style="font-size:4rem;font-weight:800;letter-spacing:-.06em;color:var(--surface-4);line-height:1">404</div>
  <div style="font-size:1.15rem;font-weight:600;color:var(--text)">Page not found</div>
  <div style="font-size:.875rem;color:var(--text-2);max-width:320px;line-height:1.65">
    The page you're looking for doesn't exist or was moved.
  </div>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn--primary" style="margin-top:.5rem">
    Back to dashboard
  </a>
</div>
{% endblock %}
