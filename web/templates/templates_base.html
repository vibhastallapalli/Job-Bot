<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}job-bot{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/css_style.css') }}" />
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body>

<nav class="nav">
  <span class="nav__brand">job<em>-bot</em></span>
  <div class="nav__links">
    {% set ep = request.endpoint %}
    <a href="{{ url_for('main.dashboard') }}"
       class="nav__link{% if ep == 'main.dashboard' %} active{% endif %}">Dashboard</a>
    <a href="{{ url_for('main.jobs') }}"
       class="nav__link{% if ep in ('main.jobs', 'main.job_detail') %} active{% endif %}">Jobs</a>
    <a href="{{ url_for('main.resume') }}"
       class="nav__link{% if ep == 'main.resume' %} active{% endif %}">Resume</a>
    <a href="{{ url_for('main.applications') }}"
       class="nav__link{% if ep == 'main.applications' %} active{% endif %}">Applications</a>
    <a href="{{ url_for('main.settings') }}"
       class="nav__link{% if ep == 'main.settings' %} active{% endif %}">Settings</a>
    <a href="{{ url_for('main.logs') }}"
       class="nav__link{% if ep == 'main.logs' %} active{% endif %}">Logs</a>
  </div>
  <button id="theme-toggle" class="nav__theme-toggle" aria-label="Toggle light/dark mode">
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</nav>

<div class="content">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flashes">
      {% for category, message in messages %}
      <div class="flash flash--{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<button id="back-to-top" aria-label="Back to top">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>
<script src="{{ url_for('static', filename='js/js_main.js') }}"></script>
</body>
</html>
